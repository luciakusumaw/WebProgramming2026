<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPUS-Mini - Add Member</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <div class="container header-container">
      <div class="logo">
        <a href="../index.html">SIMPUS-Mini</a>
      </div>

    
      <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>

      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="../books/list.html">Books</a></li>
          <li><a href="list.html">Members</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Add New Member</h2>

   
    <form id="form-add">
      <div class="form-group">
        <label for="member_no">Member No. *</label>
        <input type="text" id="member_no" name="member_no">
      </div>

      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name">
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" name="address">
      </div>

      <div class="form-group">
        <label for="phone_no">Phone Number</label>
        <input type="text" id="phone_no" name="phone_no">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="list.html" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 SIMPUS-Mini. State Polytechnic of Malang.</p>
    </div>
  </footer>

 
  <script src="../assets/js/app.js"></script>
</body>
</html>
