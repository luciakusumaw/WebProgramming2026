<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPUS-Mini - Book List</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <div class="container header-container">
      <div class="logo">
        <a href="../index.html">SIMPUS-Mini</a>
      </div>

      <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>

      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="list.html">Books</a></li>
          <li><a href="../members/list.html">Members</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h2>Book List</h2>
      <a href="add.html" class="btn btn-primary">+ Add Book</a>
    </div>

    <div class="search-box">
      <label for="search-input">Search Book Title</label>
      <input type="text" id="search-input" placeholder="Type a book title...">
    </div>

  
    <p id="loading-indicator" style="display: none;">Loading data...</p>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 SIMPUS-Mini. State Polytechnic of Malang.</p>
    </div>
  </footer>

  <script src="../assets/js/app.js"></script>
 
  <script src="../assets/js/books.js"></script>
</body>
</html>
