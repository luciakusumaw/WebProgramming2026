<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPUS-Mini - Add Book</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <div class="container header-container">
      <div class="logo">
        <a href="../index.html">SIMPUS-Mini</a>
      </div>

    
      <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>

      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="list.html">Books</a></li>
          <li><a href="../members/list.html">Members</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Add New Book</h2>

  
    <form id="form-add">
      <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" id="title" name="title">
      </div>

      <div class="form-group">
        <label for="author">Author *</label>
        <input type="text" id="author" name="author">
      </div>

      <div class="form-group">
        <label for="year">Publication Year *</label>
        <input type="number" id="year" name="year" min="1900" max="2026">
      </div>

      <div class="form-group">
        <label for="stock">Stock *</label>
        <input type="number" id="stock" name="stock" min="0">
      </div>

      <div class="form-group">
        <label for="isbn">ISBN (Optional)</label>
        <input type="text" id="isbn" name="isbn">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="list.html" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 SIMPUS-Mini. State Polytechnic of Malang.</p>
    </div>
  </footer>

 
  <script src="../assets/js/app.js"></script>
</body>
</html>
